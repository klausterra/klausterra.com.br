<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Gradientes Heráldicos -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#D9A84E" />
      <stop offset="50%" stop-color="#B8860B" />
      <stop offset="75%" stop-color="#E8C374" />
      <stop offset="100%" stop-color="#8C6510" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6510" />
      <stop offset="30%" stop-color="#E8C374" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#FFF3C4" />
    </linearGradient>

    <linearGradient id="blueField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B47" />
      <stop offset="50%" stop-color="#0A1828" />
      <stop offset="100%" stop-color="#050C14" />
    </linearGradient>

    <linearGradient id="redField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E22" />
      <stop offset="50%" stop-color="#5E1114" />
      <stop offset="100%" stop-color="#3A080A" />
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#DCE2E6" />
      <stop offset="70%" stop-color="#B0B9BF" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D9A84E" flood-opacity="0.25" />
    </filter>

    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Grupo Principal com Sombra -->
  <g filter="url(#shadowDepth)" transform="translate(0, 10)">
    
    <!-- Paquife Superior / Mantling Heráldico Esquerdo -->
    <path d="M 250 110 C 220 70 160 60 120 90 C 90 112 85 150 100 180 C 110 200 80 220 65 245 C 50 270 60 300 85 315 C 105 327 125 310 130 290 C 135 270 125 240 145 220 C 165 200 195 210 215 190 C 230 175 225 140 250 110 Z" 
          fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 250 110 C 230 80 180 75 140 105 C 115 125 110 160 125 185 C 135 200 105 225 95 245 C 80 275 100 295 115 285 C 130 260 140 225 170 205 C 195 190 220 170 250 110 Z" 
          fill="url(#redField)" opacity="0.8" />

    <!-- Paquife Superior / Mantling Heráldico Direito -->
    <path d="M 250 110 C 280 70 340 60 380 90 C 410 112 415 150 400 180 C 390 200 420 220 435 245 C 450 270 440 300 415 315 C 395 327 375 310 370 290 C 365 270 375 240 355 220 C 335 200 305 210 285 190 C 270 175 275 140 250 110 Z" 
          fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 250 110 C 270 80 320 75 360 105 C 385 125 390 160 375 185 C 365 200 395 225 405 245 C 420 275 400 295 385 285 C 370 260 360 225 330 205 C 305 190 280 170 250 110 Z" 
          fill="url(#blueField)" opacity="0.8" />

    <!-- Elmo Heráldico Superior (Helmo em Perfil/Frontal estilizado) -->
    <g transform="translate(250, 110)">
      <!-- Coroa / Torce de Ouro e Prata -->
      <rect x="-55" y="-18" width="110" height="16" rx="6" fill="url(#goldGrad)" stroke="#6A4905" stroke-width="1.5" />
      <circle cx="-36" cy="-10" r="4" fill="url(#silverGrad)" />
      <circle cx="-18" cy="-10" r="4" fill="url(#redField)" />
      <circle cx="0" cy="-10" r="4" fill="url(#silverGrad)" />
      <circle cx="18" cy="-10" r="4" fill="url(#redField)" />
      <circle cx="36" cy="-10" r="4" fill="url(#silverGrad)" />

      <!-- Capacete / Visor -->
      <path d="M -40 -10 C -45 25 -35 55 -25 70 C -15 80 15 80 25 70 C 35 55 45 25 40 -10 Z" 
            fill="url(#silverGrad)" stroke="#4A5568" stroke-width="2" />
      <!-- Fendas do Visor (Grades) -->
      <path d="M -18 20 L -18 52 M -9 18 L -9 56 M 0 16 L 0 58 M 9 18 L 9 56 M 18 20 L 18 52" 
            stroke="#1A202C" stroke-width="2.5" stroke-linecap="round" />
      <!-- Medalhão no Pescoço do Elmo -->
      <circle cx="0" cy="72" r="7" fill="url(#goldGrad)" stroke="#5A3E02" stroke-width="1.5" />
    </g>

    <!-- ESCUDO CLÁSSICO (SHIELD) -->
    <g transform="translate(250, 175)">
      <!-- Borda Externa Ornamentada Ouro -->
      <path d="M -145 0 L 145 0 C 145 140 120 220 0 310 C -120 220 -145 140 -145 0 Z" 
            fill="url(#goldBorder)" filter="url(#subtleGlow)" />
      
      <!-- Borda Interna Ouro e Preto -->
      <path d="M -135 10 L 135 10 C 135 135 112 210 0 295 C -112 210 -135 135 -135 10 Z" 
            fill="#0B1418" stroke="url(#goldGrad)" stroke-width="3" />

      <!-- Campo do Escudo (Partição Esquartejada / Estilizada) -->
      <g clip-path="url(#shieldClip)">
        <clipPath id="shieldClip">
          <path d="M -130 15 L 130 15 C 130 130 108 202 0 285 C -108 202 -130 130 -130 15 Z" />
        </clipPath>

        <!-- Quartel Superior Esquerdo (Azul Profundo Nobre) -->
        <rect x="-140" y="0" width="140" height="140" fill="url(#blueField)" />
        
        <!-- Quartel Superior Direito (Vermelho Bordô Imperial) -->
        <rect x="0" y="0" width="140" height="140" fill="url(#redField)" />
        
        <!-- Quartel Inferior Esquerdo (Vermelho Bordô) -->
        <rect x="-140" y="140" width="140" height="160" fill="url(#redField)" />
        
        <!-- Quartel Inferior Direito (Azul Profundo) -->
        <rect x="0" y="140" width="140" height="160" fill="url(#blueField)" />

        <!-- Cruz / Divisão Central em Ouro -->
        <path d="M -140 133 L 140 133 L 140 147 L -140 147 Z" fill="url(#goldGrad)" />
        <path d="M -7 0 L 7 0 L 7 300 L -7 300 Z" fill="url(#goldGrad)" />

        <!-- Carga Heráldica 1 (Q1 - Estrela de 5 Pontas Ouro - Orientação & Luz) -->
        <g transform="translate(-65, 70) scale(1.2)">
          <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" 
                   fill="url(#goldGrad)" stroke="#5A3E02" stroke-width="0.8" />
        </g>

        <!-- Carga Heráldica 2 (Q2 - Leão / Símbolo de Fortaleza Ouro estilizado) -->
        <g transform="translate(65, 70) scale(0.9)">
          <!-- Torre / Fortaleza de Pedra em Prata/Ouro -->
          <path d="M -16 20 L 16 20 L 12 -12 L 16 -12 L 16 -22 L 8 -22 L 8 -16 L -8 -16 L -8 -22 L -16 -22 L -16 -12 L -12 -12 Z" 
                fill="url(#silverGrad)" stroke="#1A202C" stroke-width="1.2" />
          <rect x="-4" y="2" width="8" height="14" rx="4" fill="#0A1828" />
        </g>

        <!-- Carga Heráldica 3 (Q3 - Carvalho / Raiz / Terra - Símbolo de Solidez e Continuidade) -->
        <g transform="translate(-65, 195) scale(0.95)">
          <path d="M -3 18 L 3 18 L 2 2 C 8 -2 14 -10 12 -18 C 8 -24 -8 -24 -12 -18 C -14 -10 -8 -2 -2 2 Z" 
                fill="url(#goldGrad)" stroke="#5A3E02" stroke-width="1" />
        </g>

        <!-- Carga Heráldica 4 (Q4 - Estrela / Compasso / Inovação & Engenho) -->
        <g transform="translate(65, 195) scale(1.1)">
          <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" 
                   fill="url(#goldGrad)" stroke="#5A3E02" stroke-width="0.8" />
        </g>

        <!-- Chevron / Escudo Central (Inescutcheon) - Marca Central Terra -->
        <g transform="translate(0, 140)">
          <polygon points="0,-32 26,-14 26,16 0,34 -26,16 -26,-14" 
                   fill="#0B1418" stroke="url(#goldGrad)" stroke-width="2.5" />
          <polygon points="0,-24 18,-11 18,11 0,24 -18,11 -18,-11" 
                   fill="url(#goldGrad)" opacity="0.2" />
          <!-- Letra 'T' ou Flor-de-lis / Motivo Central de Legado -->
          <path d="M -11 -12 L 11 -12 L 11 -6 L 3 -6 L 3 14 L -3 14 L -3 -6 L -11 -6 Z" 
                fill="url(#goldGrad)" stroke="#5A3E02" stroke-width="0.5" />
        </g>
      </g>
      
      <!-- Friso de Realce de Luz do Escudo -->
      <path d="M -130 16 L 130 16" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    </g>

    <!-- Faixa Inferior (Listel Heráldico) -->
    <g transform="translate(250, 485)">
      <!-- Fita Curva de Ouro / Pergaminho Escuro Nobre -->
      <path d="M -140 -4 C -70 18 70 18 140 -4 L 160 16 C 145 22 135 24 125 18 C 65 36 -65 36 -125 18 C -135 24 -145 22 -160 16 Z" 
            fill="url(#goldGrad)" stroke="#5A3E02" stroke-width="1.5" />
      <path d="M -125 2 C -60 20 60 20 125 2 C 70 24 -70 24 -125 2 Z" 
            fill="#0B1418" opacity="0.85" />
      <!-- Inscrição Institucional "TERRA" -->
      <text x="0" y="16" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="15" font-weight="700" letter-spacing="7" fill="url(#goldGrad)">TERRA</text>
    </g>
  </g>
</svg>
